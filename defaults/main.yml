# defaults file for percona-server
---
percona_server_version: 8.0.29
percona_allow_downgrade: false

# Hold the packages installed with an exact version (server, client, common, client library, xtrabackup),
# so that `apt upgrade` does not change them; they are unheld automatically when their version changes.
# Set to false to unhold.
percona_server_hold: true

# Repositories (http://repo.percona.com/<name>/apt) per major version of percona_server_version
percona_server_repository_url: http://repo.percona.com
percona_server_repository_names_map:
  '8.0':
    - ps-80
    - tools
  '8.4':
    - ps-84-lts
    - pxb-84-lts
    # percona-telemetry-agent (required by percona-server-server) is not in ps-84-lts
    - telemetry
    - tools
percona_server_repository_remove_others: true
# Repositories are signed-by this keyring (the same as percona-release uses), the key is added to it
percona_server_repository_keyring: /usr/share/keyrings/percona-keyring.gpg
percona_server_repository_key_id: 9334A25F8507EFA5

# Client library soname changed within 8.4: libperconaserverclient22 up to 8.4.7, libperconaserverclient24 since 8.4.8
percona_server_client_lib_package: >-
  {{
    'libperconaserverclient21' if percona_server_version_major == '8.0' else
    'libperconaserverclient22' if percona_server_version_upstream is version('8.4.8', '<') else
    'libperconaserverclient24'
  }}

percona_server_root_password: '+eswuw9uthUteFreyAqu'

percona_server_use_legacy_auth_method: false

percona_server_etc_my_cnf: []

percona_server_user_root_cnf_manage: true
percona_server_user_root_cnf_preset:
  - section: client
    options:
      - name: host
        value: localhost
      - name: user
        value: root
      - name: password
        value: "'{{ percona_server_root_password }}'"
percona_server_user_root_cnf: "{{ percona_server_user_root_cnf_preset }}"
percona_server_user_hide_passwords: true

percona_server_install:
  - xtrabackup

percona_server_ssl_map: {}

percona_server_plugins_present: []
percona_server_plugins_absent: []

percona_server_databases_present: []
percona_server_databases_absent:
  # Remove test database
  - name: test

percona_server_users_present: []
percona_server_users_present_hosts:
  - 'localhost'

percona_server_users_absent:
  # Remove anonymous users
  - name: ''
percona_server_users_absent_hosts:
  - "{{ ansible_hostname }}"
  - '127.0.0.1'
  - 'localhost'
  - '::1'
  - '%'

percona_server_queries: []

percona_server_zoneinfo_manage: false
percona_server_zoneinfo_tz_dir: /usr/share/zoneinfo
percona_server_zoneinfo_tz_file: ''
percona_server_zoneinfo_tz_name: ''
percona_server_zoneinfo_command: "mysql_tzinfo_to_sql {{ percona_server_zoneinfo_tz_dir }}"

percona_server_toolkit_udfs_manage: true
