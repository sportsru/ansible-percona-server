# vars file for percona-server
---
percona_server_version_deb: "{{ percona_server_version }}.{{ ansible_distribution_release }}"

# Major version (e.g. 8.0, 8.4) derived from the full package version (e.g. 8.4.6-6-1)
percona_server_version_major: "{{ (percona_server_version | string).split('.')[0:2] | join('.') }}"
percona_server_version_upstream: "{{ (percona_server_version | string).split('-')[0] }}"
percona_xtrabackup_version_major: "{{ (percona_xtrabackup_version | default('') | string).split('.')[0:2] | join('.') }}"

percona_server_versions_supported: "{{ percona_server_repository_names_map.keys() | list }}"

percona_server_repository_types:
  - deb
  - deb-src

percona_server_repository_names: "{{ percona_server_repository_names_map[percona_server_version_major] }}"
# Repositories of the other major versions (e.g. ps-80 after switching to 8.4)
percona_server_repository_names_absent: "{{ percona_server_repository_names_map.values() | flatten | unique | difference(percona_server_repository_names) }}"

percona_server_xtrabackup_package: "percona-xtrabackup-{{ percona_server_version_major | replace('.', '') }}"

percona_server_debconf_selections:
  - name: "percona-server-server={{ percona_server_version_deb }}"
    question: percona-server-server/root_password
    value: "{{ percona_server_root_password }}"
    vtype: password
  - name: "percona-server-server={{ percona_server_version_deb }}"
    question: percona-server-server/root_password_again
    value: "{{ percona_server_root_password }}"
    vtype: password

percona_server_dependencies:
  - "percona-server-client={{ percona_server_version_deb }}"
  - "percona-server-server={{ percona_server_version_deb }}"
  - "percona-server-common={{ percona_server_version_deb }}"
  - "{{ percona_server_client_lib_package }}={{ percona_server_version_deb }}"
  - "{{ percona_server_xtrabackup_package }}={{ percona_xtrabackup_version }}.{{ ansible_distribution_release }}"
  - "python3-mysqldb"

percona_server_etc_mysql_my_cnf: /etc/mysql/my.cnf

percona_server_lock_path: /var/lib/ansible/percona-server/lock

# Percona Toolkit UDFs: shared libraries up to 8.0, component_percona_udf since 8.4
percona_server_toolkit_udfs:
  - function: fnv1a_64
    soname: libfnv1a_udf.so
  - function: fnv_64
    soname: libfnv_udf.so
  - function: murmur_hash
    soname: libmurmur_udf.so
percona_server_toolkit_udfs_component: file://component_percona_udf

# See https://www.percona.com/doc/percona-server/5.6/diagnostics/response_time_distribution.html#installing-the-plugins
percona_server_plugins_query_response_time_plugin_preset:
  - name: QUERY_RESPONSE_TIME_AUDIT
    soname: query_response_time.so
  - name: QUERY_RESPONSE_TIME
    soname: query_response_time.so
  - name: QUERY_RESPONSE_TIME_READ
    soname: query_response_time.so
  - name: QUERY_RESPONSE_TIME_WRITE
    soname: query_response_time.so
